<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ 'Edit' if project else 'Add' }} Project</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><header class="nav"><a class="brand" href="{{url_for('admin')}}">JUNAID<b>.</b> ADMIN</a><nav class="links"><a href="{{url_for('admin')}}">Dashboard</a><a href="/">Portfolio ↗</a></nav></header><main class="form-card"><div class="eyebrow">PROJECT DATABASE</div><h1>{{ 'Edit' if project else 'Add' }} Project</h1>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{category}}">{{message}}</div>{% endfor %}{% endwith %}<form method="post" enctype="multipart/form-data"><label>TITLE *</label><input name="title" required value="{{project['title'] if project else ''}}"><label>CATEGORY *</label><input name="category" required placeholder="ROBOTICS / AI / CNC" value="{{project['category'] if project else ''}}"><label>YEAR</label><input name="year" value="{{project['year'] if project else '2026'}}"><label>DESCRIPTION *</label><textarea name="description" required>{{project['description'] if project else ''}}</textarea><label>TECHNOLOGIES (comma separated)</label><input name="technologies" placeholder="ROS 2, C++, Gazebo" value="{{project['technologies'] if project else ''}}"><label>GITHUB URL</label><input name="github" type="url" placeholder="https://github.com/..." value="{{project['github'] if project else ''}}"><label>PROJECT IMAGE</label><input name="image" type="file" accept=".png,.jpg,.jpeg,.webp,.gif">{% if project and project['image'] %}<img class="current-img" src="{{url_for('static',filename='uploads/projects/'+project['image'])}}" alt="Current project image">{% endif %}<div class="actions"><button class="btn primary" type="submit">{{ 'UPDATE PROJECT' if project else 'ADD PROJECT' }} →</button><a class="btn" href="{{url_for('admin')}}">CANCEL</a></div></form></main></body></html>
