<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><div class="login"><form class="login-card" method="post"><div class="eyebrow">PRIVATE CONTROL PANEL</div><h1>Admin Login</h1><p class="login-note">Only the portfolio owner should use this page. Credentials are checked by the server.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{category}}">{{message}}</div>{% endfor %}{% endwith %}<label>USERNAME</label><input name="username" autocomplete="username" required><label>PASSWORD</label><input type="password" name="password" autocomplete="current-password" required><button class="btn primary" style="margin-top:22px;cursor:pointer;width:100%">SIGN IN →</button></form></div></body></html>
